<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac TON</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Header */
        .header { 
            text-align: center; 
            padding: 20px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 15px; 
            margin-bottom: 20px; 
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        /* Game Area */
        .game-area {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        
        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .cell.x { color: #ff6b6b; }
        .cell.o { color: #4c6ef5; }
        
        /* Betting Section */
        .bet-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .bet-buttons {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .bet-btn {
            flex: 1;
            min-width: 80px;
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }
        
        .bet-btn.active {
            border-color: #20c997;
            background: rgba(32, 201, 151, 0.2);
        }
        
        .join-btn {
            width: 100%;
            padding: 18px;
            background: #20c997;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Wallet */
        .wallet-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
        }
        
        .wallet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn.deposit { background: #667eea; color: white; }
        .btn.withdraw { background: #ff4757; color: white; }
        
        /* Loading */
        .loading {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .loading.show { display: flex; }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #20c997;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎮 TIC TAC TON</h1>
            <p>Play Tic Tac Toe • Win TON</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div style="font-size: 24px;" id="games-played">0</div>
                <div style="font-size: 12px; opacity: 0.8;">Games</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 24px;" id="win-rate">0%</div>
                <div style="font-size: 12px; opacity: 0.8;">Win Rate</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 24px;" id="balance">0 TON</div>
                <div style="font-size: 12px; opacity: 0.8;">Balance</div>
            </div>
        </div>
        
        <!-- Game Area -->
        <div class="game-area" id="game-area">
            <div style="text-align: center;">
                <h3 style="margin-bottom: 10px;">🎮 TIC TAC TOE</h3>
                <p style="opacity: 0.8; margin-bottom: 20px;">Select bet amount and click JOIN GAME</p>
                <div style="font-size: 60px; opacity: 0.3;">
                    <i class="fas fa-gamepad">⚔️</i>
                </div>
            </div>
        </div>
        
        <!-- Betting Section -->
        <div class="bet-section">
            <div style="text-align: center; margin-bottom: 15px;">
                <strong>SELECT BET AMOUNT</strong>
            </div>
            
            <!-- Horizontal Bet Buttons -->
            <div class="bet-buttons">
                <button class="bet-btn active" data-bet="0.5">0.5 TON</button>
                <button class="bet-btn" data-bet="1">1 TON</button>
                <button class="bet-btn" data-bet="5">5 TON</button>
                <button class="bet-btn" data-bet="10">10 TON</button>
                <button class="bet-btn" data-bet="20">20 TON</button>
            </div>
            
            <button class="join-btn" id="join-game">🎮 JOIN GAME</button>
        </div>
        
        <!-- Wallet Section -->
        <div class="wallet-section">
            <div style="text-align: center; margin-bottom: 15px;">
                <strong>💰 WALLET</strong>
            </div>
            
            <div class="wallet-actions">
                <button class="btn deposit" id="deposit-btn">DEPOSIT</button>
                <button class="btn withdraw" id="withdraw-btn">WITHDRAW</button>
            </div>
            
            <button id="connect-wallet" style="width: 100%; padding: 15px; margin-top: 10px; background: #ffd43b; border: none; border-radius: 10px; font-weight: bold;">
                🔗 CONNECT WALLET
            </button>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="margin-top: 20px; font-size: 18px;" id="loading-text">Finding opponent...</div>
        <button id="cancel-loading" style="margin-top: 20px; padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 10px;">
            Cancel
        </button>
    </div>
    
    <script>
        // Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.hide();
        
        // Your Server URL (CHANGE THIS!)
        const SERVER_URL = 'https://tic-tac-ton.onrender.com'; // CHANGE THIS
        
        // Game State
        let gameState = {
            balance: 10.5,
            betAmount: 0.5,
            gamesPlayed: 0,
            gamesWon: 0,
            currentGame: null,
            isPlaying: false,
            playerSymbol: 'X'
        };
        
        // Initialize
        function init() {
            updateDisplay();
            setupEventListeners();
            
            // Load saved data
            const saved = localStorage.getItem('tictacton_data');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.gamesPlayed = data.gamesPlayed || 0;
                gameState.gamesWon = data.gamesWon || 0;
                updateDisplay();
            }
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Bet buttons
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gameState.betAmount = parseFloat(this.dataset.bet);
                });
            });
            
            // Join Game
            document.getElementById('join-game').addEventListener('click', joinGame);
            
            // Deposit
            document.getElementById('deposit-btn').addEventListener('click', () => {
                tg.showPopup({
                    title: 'Deposit TON',
                    message: 'Send TON to this address:\n\nEQD...YOUR_WALLET_ADDRESS\n\nInclude your Telegram ID in the message',
                    buttons: [{ type: 'ok', text: 'Copy Address' }]
                }, (btnId) => {
                    if (btnId === 'ok') {
                        navigator.clipboard.writeText('EQD...YOUR_WALLET_ADDRESS');
                        tg.showAlert('Address copied!');
                    }
                });
            });
            
            // Withdraw
            document.getElementById('withdraw-btn').addEventListener('click', () => {
                tg.showPopup({
                    title: 'Withdraw TON',
                    message: `Available: ${gameState.balance} TON\n\nMinimum: 1 TON\n\nContact @TicTacTON_support to withdraw`,
                    buttons: [{ type: 'ok', text: 'OK' }]
                });
            });
            
            // Connect Wallet
            document.getElementById('connect-wallet').addEventListener('click', () => {
                tg.showAlert('Wallet connected in Telegram Mini App!\n\nYour Telegram ID is used as wallet.');
            });
            
            // Cancel loading
            document.getElementById('cancel-loading').addEventListener('click', () => {
                hideLoading();
            });
        }
        
        // Join Game Function
        async function joinGame() {
            if (gameState.balance < gameState.betAmount) {
                tg.showAlert(`Need ${gameState.betAmount} TON to play\n\nCurrent balance: ${gameState.balance} TON`);
                return;
            }
            
            showLoading('Finding opponent...');
            
            try {
                // Call your server
                const response = await fetch(SERVER_URL + '/find-game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        playerAddress: tg.initDataUnsafe.user?.id || 'player_' + Date.now(),
                        betAmount: gameState.betAmount
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    hideLoading();
                    
                    if (data.opponent) {
                        // Game found
                        startGame(data.gameId, data.yourSymbol, data.opponent);
                    } else {
                        // Waiting for opponent
                        tg.showAlert('Waiting for opponent...\nShare with friends to play faster!');
                        waitForOpponent(data.gameId);
                    }
                } else {
                    tg.showAlert('Error: ' + (data.error || 'Unknown error'));
                    hideLoading();
                }
                
            } catch (error) {
                tg.showAlert('Server error. Using demo mode...');
                hideLoading();
                startDemoGame();
            }
        }
        
        // Start Game
        function startGame(gameId, symbol, opponent) {
            gameState.currentGame = { gameId, symbol, opponent };
            gameState.isPlaying = true;
            gameState.gamesPlayed++;
            
            // Deduct bet
            gameState.balance -= gameState.betAmount;
            updateDisplay();
            
            // Show game board
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = `
                <div style="width: 100%; text-align: center;">
                    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                        <div style="font-size: 14px; opacity: 0.8;">Playing vs ${opponent}</div>
                        <div style="font-size: 18px; font-weight: bold; margin: 10px 0;">
                            Bet: ${gameState.betAmount} TON • Prize: ${(gameState.betAmount * 2).toFixed(2)} TON
                        </div>
                        <div style="font-size: 16px;">Your symbol: <span style="font-size: 24px; color: ${symbol === 'X' ? '#ff6b6b' : '#4c6ef5'}">${symbol}</span></div>
                    </div>
                    
                    <div class="game-board" id="game-board">
                        ${Array(9).fill().map((_, i) => `<div class="cell" data-index="${i}"></div>`).join('')}
                    </div>
                    
                    <div style="margin: 20px 0; font-size: 18px;" id="game-status">
                        ${symbol === 'X' ? 'Your turn!' : 'Waiting for opponent...'}
                    </div>
                    
                    <button id="forfeit-btn" style="padding: 12px 24px; background: rgba(255,71,87,0.2); color: #ff4757; border: none; border-radius: 10px;">
                        🏳️ Forfeit
                    </button>
                </div>
            `;
            
            // Setup game board
            setupGameBoard();
            
            // Setup forfeit button
            document.getElementById('forfeit-btn').addEventListener('click', forfeitGame);
            
            // If player is O, wait for opponent move
            if (symbol === 'O') {
                setTimeout(makeOpponentMove, 2000);
            }
        }
        
        // Setup Game Board
        function setupGameBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.addEventListener('click', function() {
                    if (!this.textContent && gameState.isPlaying) {
                        this.textContent = gameState.currentGame.symbol;
                        this.classList.add(gameState.currentGame.symbol === 'X' ? 'x' : 'o');
                        checkGameResult();
                        
                        // Opponent move after delay
                        setTimeout(makeOpponentMove, 1500);
                    }
                });
            });
        }
        
        // Opponent Move
        function makeOpponentMove() {
            if (!gameState.isPlaying) return;
            
            const cells = document.querySelectorAll('.cell');
            const emptyCells = Array.from(cells).filter(cell => !cell.textContent);
            
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const opponentSymbol = gameState.currentGame.symbol === 'X' ? 'O' : 'X';
                randomCell.textContent = opponentSymbol;
                randomCell.classList.add(opponentSymbol === 'X' ? 'x' : 'o');
                checkGameResult();
            }
        }
        
        // Check Game Result
        function checkGameResult() {
            const cells = document.querySelectorAll('.cell');
            const board = Array.from(cells).map(cell => cell.textContent);
            
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            
            for (let pattern of winPatterns) {
                const [a,b,c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    if (board[a] === gameState.currentGame.symbol) {
                        playerWins();
                    } else {
                        playerLoses();
                    }
                    return;
                }
            }
            
            if (board.every(cell => cell)) {
                // Draw
                setTimeout(() => {
                    tg.showAlert("🤝 Draw! Bet refunded.");
                    gameState.balance += gameState.betAmount;
                    resetGame();
                }, 500);
            }
        }
        
        // Player Wins
        function playerWins() {
            gameState.isPlaying = false;
            gameState.gamesWon++;
            
            // Founder takes 10% (hidden from user)
            const totalPrize = gameState.betAmount * 2;
            const founderFee = totalPrize * 0.10; // 10%
            const playerPrize = totalPrize - founderFee; // 90%
            
            gameState.balance += playerPrize;
            updateDisplay();
            saveData();
            
            setTimeout(() => {
                tg.showAlert(`🎉 YOU WIN!\n\n+${playerPrize.toFixed(2)} TON\n\n(10% fee applied automatically)`);
                resetGame();
            }, 500);
        }
        
        // Player Loses
        function playerLoses() {
            gameState.isPlaying = false;
            updateDisplay();
            saveData();
            
            setTimeout(() => {
                tg.showAlert('💔 You lost this round');
                resetGame();
            }, 500);
        }
        
        // Forfeit Game
        function forfeitGame() {
            if (confirm('Forfeit and lose your bet?')) {
                gameState.isPlaying = false;
                tg.showAlert('Game forfeited. Bet lost.');
                resetGame();
            }
        }
        
        // Wait for Opponent (poll server)
        function waitForOpponent(gameId) {
            const checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(SERVER_URL + '/game-status/' + gameId);
                    const data = await response.json();
                    
                    if (data.success && data.game.player2) {
                        clearInterval(checkInterval);
                        startGame(gameId, 'O', data.game.player1);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 3000);
            
            // Timeout after 60 seconds
            setTimeout(() => {
                clearInterval(checkInterval);
                tg.showAlert('No opponent found. Bet refunded.');
                gameState.balance += gameState.betAmount;
                updateDisplay();
            }, 60000);
        }
        
        // Demo Game (if server fails)
        function startDemoGame() {
            tg.showAlert('Starting demo game...');
            startGame('demo_' + Date.now(), 'X', 'Demo Player');
        }
        
        // Reset Game
        function resetGame() {
            gameState.isPlaying = false;
            gameState.currentGame = null;
            
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = `
                <div style="text-align: center;">
                    <h3 style="margin-bottom: 10px;">🎮 TIC TAC TOE</h3>
                    <p style="opacity: 0.8; margin-bottom: 20px;">Select bet amount and click JOIN GAME</p>
                    <div style="font-size: 60px; opacity: 0.3;">
                        <i class="fas fa-gamepad">⚔️</i>
                    </div>
                </div>
            `;
        }
        
        // Update Display
        function updateDisplay() {
            document.getElementById('balance').textContent = gameState.balance.toFixed(2) + ' TON';
            document.getElementById('games-played').textContent = gameState.gamesPlayed;
            const winRate = gameState.gamesPlayed > 0 ? Math.round((gameState.gamesWon / gameState.gamesPlayed) * 100) : 0;
            document.getElementById('win-rate').textContent = winRate + '%';
        }
        
        // Save Data
        function saveData() {
            const data = {
                gamesPlayed: gameState.gamesPlayed,
                gamesWon: gameState.gamesWon,
                balance: gameState.balance
            };
            localStorage.setItem('tictacton_data', JSON.stringify(data));
        }
        
        // Show Loading
        function showLoading(text) {
            document.getElementById('loading').classList.add('show');
            document.getElementById('loading-text').textContent = text;
        }
        
        // Hide Loading
        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }
        
        // Start when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
